---
########################################################################
# Disable swap immediately and persistently through /etc/fstab
########################################################################

- name: Check active swap
  ansible.builtin.command:
    argv:
      - /usr/sbin/swapon
      - --show
      - --noheadings
  register: res_check_active_swap
  changed_when: false
  check_mode: false

- name: Disable active swap
  ansible.builtin.command:
    argv:
      - /usr/sbin/swapoff
      - -a
  when: res_check_active_swap.stdout | trim | length > 0
  changed_when: true

- name: Comment out persistent swap entries
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([ \t]*[^#\s]+\s+\S+\s+swap\s+.*)$'
    replace: '# \1'
    backup: true

- name: Verify no swap remains active
  ansible.builtin.command:
    argv:
      - /usr/sbin/swapon
      - --show
      - --noheadings
  register: res_remaining_swap
  changed_when: false
  failed_when: res_remaining_swap.stdout | trim | length > 0
  when: not ansible_check_mode

########################################################################
# Install prerequisite packages
########################################################################

- name: Install prerequisite packages
  ansible.builtin.apt:
    name: "{{ kubeadm_required_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

########################################################################
# Enable IPv4 packet forwarding
########################################################################

# A Pod has its own network interface and IP address. 
# When its traffic needs to leave the node, Linux must forward packets 
# between the Pod’s virtual interface and the VM’s network interface:
# Pod → VM networking → another node or the internet
# With net.ipv4.ip_forward=0, Linux doesn’t forward IPv4 packets 
# between interfaces. Setting it to 1 permits forwarding; your CNI configures 
# the routes and networking rules. Firewall rules can still restrict traffic.

- name: Check IPv4 packet forwarding
  ansible.builtin.command:
    argv:
      - /usr/sbin/sysctl
      - -n
      - net.ipv4.ip_forward
  register: res_check_pkt_fwd
  changed_when: false

- name: Persist IPv4 packet forwarding
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.ipv4.ip_forward = 1
    owner: root
    group: root
    mode: "0644"

- name: Enable IPv4 packet forwarding immediately
  ansible.builtin.command:
    argv:
      - /usr/sbin/sysctl
      - -w
      - net.ipv4.ip_forward=1
  when: res_check_pkt_fwd.stdout | trim == '0'
  changed_when: true


########################################################################
# Configure and verify time synchronization
########################################################################

- name: Install time synchronization service
  ansible.builtin.apt:
    name: systemd-timesyncd
    state: present

- name: Enable and start time synchronization
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    enabled: true
    state: started

- name: Wait for the system clock to synchronize
  ansible.builtin.command:
    argv:
      - timedatectl
      - show
      - --property=NTP
      - --property=NTPSynchronized
  register: ntp_status
  changed_when: false
  until: "'NTPSynchronized=yes' in ntp_status.stdout_lines"
  retries: 12
  delay: 5
  when: not ansible_check_mode

- name: Verify time synchronization
  ansible.builtin.assert:
    that:
      - "'NTP=yes' in ntp_status.stdout_lines"
      - "'NTPSynchronized=yes' in ntp_status.stdout_lines"
  when: not ansible_check_mode
