---
- name: Configure kubeadm cluster
  hosts: kubeadm_cluster
  become: true
  gather_facts: false

  pre_tasks:
    - name: Wait for SSH access to the node
      ansible.builtin.wait_for_connection:
        timeout: 300
      tags: [always]

    - name: Wait for cloud-init to finish preparing the node
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      check_mode: false
      timeout: 600
      tags: [always]

    - name: Gather node facts after cloud-init completes
      ansible.builtin.setup:
      tags: [always]

  roles:
    - kubeadm
